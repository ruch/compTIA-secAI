
<style>
*{box-sizing:border-box;margin:0;padding:0}
.exam-app{padding:1rem 0;font-family:var(--font-sans)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.hdr{margin-bottom:1.25rem}
.hdr h1{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.hdr p{font-size:13px;color:var(--color-text-secondary);margin-top:4px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.25rem}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;text-align:center}
.stat-n{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.stat-l{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.domain-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.dtab{padding:6px 13px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);font-size:12px;cursor:pointer;transition:all .15s}
.dtab:hover{background:var(--color-background-secondary)}
.dtab.on{background:#185FA5;border-color:#185FA5;color:#E6F1FB}
.domain-badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:1rem}
.dbadge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:var(--border-radius-md);background:#E6F1FB;color:#0C447C}
.domain-title{font-size:16px;font-weight:500;color:var(--color-text-primary)}
.qcard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px 18px;margin-bottom:10px}
.qtype{font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:var(--border-radius-md);margin-bottom:8px;display:inline-block}
.qtype-mc{background:#EAF3DE;color:#27500A}
.qtype-pb{background:#FAEEDA;color:#633806}
.qnum{font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px}
.qtext{font-size:13px;color:var(--color-text-primary);line-height:1.65;margin-bottom:12px}
.scenario-box{background:var(--color-background-secondary);border-left:2px solid #378ADD;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0;padding:10px 13px;margin-bottom:12px;font-size:12px;color:var(--color-text-secondary);line-height:1.6}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{padding:9px 13px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;text-align:left;cursor:pointer;transition:all .12s;line-height:1.5}
.opt:hover:not(.disabled){border-color:var(--color-border-secondary);background:var(--color-background-primary)}
.opt.correct{background:#EAF3DE;border-color:#639922;color:#27500A}
.opt.wrong{background:#FCEBEB;border-color:#E24B4A;color:#791F1F}
.opt.show-correct{background:#EAF3DE;border-color:#639922;color:#27500A}
.opt.disabled{pointer-events:none}
.exp{margin-top:11px;padding:10px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);font-size:12px;color:var(--color-text-secondary);line-height:1.6;display:none}
.exp.show{display:block}
.divider{font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-tertiary);padding-bottom:6px;border-bottom:0.5px solid var(--color-border-tertiary);margin:1.25rem 0 .75rem}
.results-panel{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:20px;margin-top:1rem;display:none}
.results-panel.show{display:block}
.results-title{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:1rem}
.domain-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:1rem}
.dr-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px;text-align:center}
.dr-score{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.dr-label{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.dr-domain{font-size:10px;color:var(--color-text-tertiary);margin-top:4px}
.submit-row{margin-top:1.25rem;display:flex;gap:10px;align-items:center}
.score-pct{font-size:32px;font-weight:500;color:var(--color-text-primary)}
.score-sub{font-size:13px;color:var(--color-text-secondary)}
.pass-badge{display:inline-block;padding:4px 12px;border-radius:var(--border-radius-md);font-size:13px;font-weight:500;margin-top:8px}
.pass{background:#EAF3DE;color:#27500A}
.fail{background:#FCEBEB;color:#791F1F}
</style>

<script>
const DOMAINS = [
  {id:'A', label:'AI Foundations', pct:'17%', color:'#185FA5'},
  {id:'B', label:'Securing AI Systems', pct:'40%', color:'#3B6D11'},
  {id:'C', label:'AI-Assisted Security', pct:'24%', color:'#854F0B'},
  {id:'D', label:'Governance, Risk & Compliance', pct:'19%', color:'#533566'}
];

const QUESTIONS = [
  {id:1,domain:'A',type:'MC',
   q:'A security researcher discovers that an AI model correctly classifies all training samples but misclassifies 40% of new, unseen data. Which of the following BEST describes the root cause?',
   opts:['A. The model was trained using unsupervised learning and lacks labeled data','B. The model overfitted to training data and failed to generalize','C. The inference pipeline is experiencing data drift after deployment','D. The model architecture is too simple to capture the underlying patterns'],
   ans:1,
   exp:'Overfitting occurs when a model memorizes training examples rather than learning generalizable patterns, resulting in high training accuracy but poor real-world performance. Data drift (C) describes environmental change post-deployment, which is not indicated here.'},
  {id:2,domain:'A',type:'MC',
   q:'An organization wants to detect novel malware families that have no existing signatures. Which of the following ML approaches is MOST appropriate?',
   opts:['A. Supervised classification using labeled malware samples','B. Unsupervised anomaly detection based on behavioral deviation','C. Reinforcement learning with malware execution rewards','D. Rule-based heuristics using known malware indicators'],
   ans:1,
   exp:'Unsupervised anomaly detection identifies deviations from normal behavior without requiring prior labels — essential for detecting novel threats that no signature database covers.'},
  {id:3,domain:'A',type:'PB',
   scenario:'An analyst is reviewing an AI system deployed for phishing email detection. The system flags 200 emails per day. Of these, 180 are actually phishing and 20 are legitimate (false positives). Of the 2,000 emails not flagged, 10 turn out to be phishing (false negatives).',
   q:'Based on this scenario, which of the following BEST characterizes the model\'s primary operational risk to the organization?',
   opts:['A. The false positive rate is too high, causing excessive SOC workload','B. The false negative rate represents undetected phishing reaching users, posing direct security risk','C. The model lacks explainability and cannot support audit requirements','D. The 90% detection rate is below the minimum acceptable threshold for production use'],
   ans:1,
   exp:'10 undetected phishing emails reaching end users pose direct organizational risk (credential theft, compromise). While false positives create analyst burden, false negatives represent successful attacks. Note: 90%+ detection is actually strong, so D is a distractor.'},
  {id:4,domain:'A',type:'MC',
   q:'Which of the following BEST describes how transformer-based large language models differ from traditional rule-based NLP systems in a security operations context?',
   opts:['A. Transformers require hand-crafted feature engineering; rule-based systems learn features automatically','B. Transformers can interpret ambiguous, natural-language threat reports at scale; rule-based systems require predefined patterns','C. Rule-based systems are more susceptible to adversarial manipulation than transformers','D. Transformers are deterministic and produce consistent outputs for identical inputs'],
   ans:1,
   exp:'LLMs process unstructured natural language contextually without requiring predefined rules — enabling extraction of threat intelligence from freeform reports, blogs, and advisories at scale.'},
  {id:5,domain:'A',type:'MC',
   q:'A threat actor uses a generative AI model to create a video of a company\'s CFO authorizing a $2M wire transfer. The video is convincingly realistic. Which of the following threats does this represent?',
   opts:['A. Adversarial example attack against a financial AI system','B. Model inversion attack to extract CFO voice data','C. Deepfake-based social engineering and business email compromise','D. Data poisoning of authentication training data'],
   ans:2,
   exp:'Deepfake technology uses generative AI (GANs or diffusion models) to synthesize realistic video/audio of real individuals — weaponized here for CEO/CFO fraud (BEC variant) requiring no technical compromise of systems.'},
  {id:6,domain:'A',type:'MC',
   q:'An AI-powered password spraying tool automatically adjusts its attempt rate and timing to stay below SIEM detection thresholds, modifying behavior based on whether authentication attempts succeed. Which AI technique is the attacker MOST likely leveraging?',
   opts:['A. Supervised classification of SIEM alerting rules','B. Reinforcement learning to optimize attack behavior based on feedback','C. Generative AI to produce password dictionaries','D. Transfer learning from prior attack campaigns'],
   ans:1,
   exp:'Reinforcement learning enables an agent to optimize behavior through trial-and-error feedback. An attacker using RL rewards successful logins and low detection rates to adaptively tune timing — a key emerging threat.'},
  {id:7,domain:'A',type:'PB',
   scenario:'A SOC team receives threat intelligence indicating a nation-state group uses polymorphic malware that rewrites its own code on each execution to evade signature detection. The current endpoint protection platform relies entirely on hash-based signature matching.',
   q:'Which of the following compensating controls BEST addresses this specific threat?',
   opts:['A. Deploying additional signature database updates on a daily schedule','B. Implementing AI-based behavioral detection that analyzes runtime execution patterns regardless of code hash','C. Enabling full packet capture on all endpoints to detect network callbacks','D. Requiring application whitelisting based on file path and publisher certificate'],
   ans:1,
   exp:'Polymorphic malware defeats hash-based signatures by design. AI behavioral detection identifies malicious execution patterns (process injection, memory manipulation) independently of code identity — the correct countermeasure.'},
  {id:8,domain:'A',type:'MC',
   q:'Which of the following MOST accurately describes adversarial machine learning as a threat category distinct from traditional cyberattacks?',
   opts:['A. Adversarial ML attacks target the cryptographic infrastructure protecting AI model weights','B. Adversarial ML attacks exploit the mathematical properties of model decision boundaries to cause misclassification or extraction','C. Adversarial ML is limited to attacks during model training and does not affect deployed inference systems','D. Adversarial ML attacks require physical access to the hardware running the AI model'],
   ans:1,
   exp:'Adversarial ML uniquely exploits model decision boundaries — through crafted inputs (evasion), poisoned training data, model extraction queries, or membership inference — fundamentally different from network or endpoint attacks.'},
  {id:9,domain:'A',type:'MC',
   q:'A company deploys a chatbot on its HR portal. An employee discovers that asking the chatbot to "summarize all previous conversations" causes it to reveal other employees\' personal HR information. Which of the following vulnerabilities does this represent?',
   opts:['A. Prompt injection exploiting the chatbot\'s instruction-following capability','B. Model inversion attack reconstructing training data','C. Data poisoning of the HR knowledge base','D. Membership inference attack against the employee database'],
   ans:0,
   exp:'The attacker uses a crafted prompt ("summarize all previous conversations") to override the chatbot\'s intended scope and extract data from other sessions — a classic prompt injection pattern.'},
  {id:10,domain:'A',type:'MC',
   q:'Which of the following is a key limitation of AI-based threat detection systems that security teams must account for when designing their defense architecture?',
   opts:['A. AI models cannot process data faster than rule-based systems','B. AI models require labeled training data that may not exist for novel zero-day threats','C. AI detection systems are incompatible with SIEM integration due to output format limitations','D. AI models become more accurate over time without retraining regardless of environmental changes'],
   ans:1,
   exp:'Supervised AI models trained on historical threat data struggle with genuine zero-days for which no training labels exist. This is why layered detection (AI + heuristics + threat hunting) is recommended over sole reliance on AI.'},
  {id:11,domain:'B',type:'MC',
   q:'A security architect is designing controls for an AI model that processes medical records to predict patient readmission risk. The model training pipeline ingests raw EHR data including names, SSNs, and diagnoses. Which of the following controls MOST directly satisfies both data minimization and privacy requirements?',
   opts:['A. Encrypting all EHR fields with AES-256 before model ingestion','B. Replacing direct identifiers with randomized tokens and generalizing quasi-identifiers before training','C. Restricting training pipeline access to data scientists with valid business justification','D. Applying differential privacy noise to model outputs post-training'],
   ans:1,
   exp:'Anonymization through tokenization of direct identifiers and generalization of quasi-identifiers satisfies data minimization (only necessary data in processable form) and privacy (re-identification prevention). Encryption (A) keeps PII processable by the model.'},
  {id:12,domain:'B',type:'PB',
   scenario:'A red team reports that by submitting 50,000 carefully crafted queries to a company\'s public AI API, they were able to reconstruct a functionally equivalent copy of the proprietary model, including its classification behavior on sensitive financial data.',
   q:'Which of the following attacks occurred, and which control would MOST directly prevent it?',
   opts:['A. Model inversion; mitigated by output perturbation and query rate limiting','B. Model extraction/stealing; mitigated by query rate limiting, output perturbation, and anomaly detection on API usage patterns','C. Data poisoning; mitigated by training data integrity validation','D. Membership inference; mitigated by differential privacy applied to training'],
   ans:1,
   exp:'Model extraction (stealing) reconstructs a functional copy through systematic API querying. Rate limiting reduces query volume; output perturbation reduces fidelity of extracted model; anomaly detection flags high-volume systematic querying patterns.'},
  {id:13,domain:'B',type:'MC',
   q:'An organization\'s AI pipeline automatically pulls labeled training data from a shared internal database. A disgruntled database administrator modifies 3% of labels on fraud transactions, changing them from "fraudulent" to "legitimate." Which control would have MOST effectively prevented this?',
   opts:['A. Applying differential privacy during model training to reduce individual record influence','B. Implementing cryptographic checksums and role-based access controls with audit logging on the training dataset','C. Using adversarial training to make the model resistant to mislabeled examples','D. Deploying a web application firewall in front of the training data API'],
   ans:1,
   exp:'Dataset integrity controls (cryptographic checksums detect modification; RBAC limits who can write; audit logs attribute changes) directly prevent and detect insider-driven label poisoning before it reaches training.'},
  {id:14,domain:'B',type:'MC',
   q:'Which of the following BEST describes the security risk introduced when an organization uses a pre-trained open-source foundation model without independent validation?',
   opts:['A. The model may not support the organization\'s preferred inference hardware','B. The model may contain backdoors triggered by specific inputs, or have been trained on poisoned data by the upstream maintainer','C. Open-source models are prohibited under GDPR for commercial AI applications','D. The model\'s weights may be too large to deploy within the organization\'s memory constraints'],
   ans:1,
   exp:'AI supply chain attacks include pre-poisoned models, backdoored weights, and malicious training data embedded by upstream contributors — analogous to software supply chain compromise but specific to AI artifacts.'},
  {id:15,domain:'B',type:'PB',
   scenario:'During a penetration test, the tester discovers that the organization\'s AI fraud detection API returns highly detailed confidence scores (e.g., 0.9873 for fraudulent, 0.0127 for legitimate) for every query. The tester uses these scores to iteratively craft transactions that gradually shift the confidence score toward "legitimate."',
   q:'Which attack is being conducted, and what is the MOST effective mitigation?',
   opts:['A. Data poisoning; retrain the model with the adversarial samples included','B. Adversarial evasion via confidence score feedback; mitigate by rounding/bucketing output scores and adding output perturbation','C. Model inversion; mitigate by restricting API access to authenticated internal users only','D. Membership inference; mitigate by applying differential privacy to the training pipeline'],
   ans:1,
   exp:'High-precision confidence scores give attackers a gradient signal to iteratively refine adversarial inputs. Reducing output granularity (bucketing: "low/medium/high") removes this feedback channel without significantly impacting legitimate use.'},
  {id:16,domain:'B',type:'MC',
   q:'A company deploys AI inference workloads in Kubernetes containers on a public cloud. The security review finds that all containers share a single service account with org-wide storage admin privileges. Which of the following BEST describes the security principle being violated and the correct remediation?',
   opts:['A. Defense in depth; remediate by adding network segmentation between containers','B. Least privilege; remediate by creating per-workload service accounts with only the permissions required for each inference task','C. Separation of duties; remediate by requiring dual approval for container deployments','D. Data minimization; remediate by reducing the volume of data processed per inference request'],
   ans:1,
   exp:'Least privilege requires each workload to have only necessary permissions. Shared admin service accounts allow any compromised container to access all storage — remediating with per-workload scoped accounts limits blast radius.'},
  {id:17,domain:'B',type:'MC',
   q:'An AI security product vendor claims its malware detection model achieves 99.9% accuracy. A security architect questions this claim for enterprise deployment. Which of the following concerns is MOST valid?',
   opts:['A. 99.9% accuracy means the model will flag every malware sample correctly','B. At high accuracy, false positive rate and base rate of malware matter more — 0.1% FP on millions of daily scans produces thousands of false alerts','C. 99.9% accuracy is artificially inflated by the use of GPUs during training','D. Accuracy is only valid when the test set was created after the training set temporally'],
   ans:1,
   exp:'The base rate fallacy: at 0.1% FP on 10M daily scans = 10,000 false alerts/day. Accuracy alone is misleading without precision, recall, and false positive rate measured against realistic class distributions.'},
  {id:18,domain:'B',type:'MC',
   q:'A healthcare organization is concerned that an AI diagnostic model may be inferring a patient\'s race from non-sensitive inputs (e.g., zip code, hospital location), creating proxy discrimination. Which of the following approaches BEST addresses this concern?',
   opts:['A. Encrypting all demographic fields before model training','B. Conducting fairness audits using disaggregated performance metrics across demographic groups and removing or adjusting proxy features','C. Applying differential privacy to model outputs to prevent inference of individual attributes','D. Retraining the model using only data from patients who consented to racial data collection'],
   ans:1,
   exp:'Proxy discrimination requires identifying and evaluating features that correlate with protected attributes. Fairness audits with disaggregated metrics reveal disparate impact; feature adjustment or adversarial debiasing then corrects it.'},
  {id:19,domain:'B',type:'PB',
   scenario:'A financial services firm\'s MLOps team receives alerts that their production fraud detection model\'s F1 score has dropped from 0.91 to 0.74 over the past 90 days. Log analysis shows that the input feature distribution has shifted significantly — new digital payment channels introduced different transaction patterns not present in training data.',
   q:'Which of the following represents the MOST complete and appropriate response?',
   opts:['A. Roll back to the previous model version, which had a higher F1 score','B. Retrain the model incorporating new transaction pattern data, validate on a holdout set reflecting current distribution, then deploy through a staged rollout with monitoring','C. Increase the fraud detection threshold to restore precision at the cost of recall','D. Apply adversarial training using synthetic examples of the new payment channel patterns'],
   ans:1,
   exp:'Data drift requires retraining on current distribution data. Validation on a current holdout set ensures the new model reflects real conditions. Staged rollout with monitoring allows regression detection. Rollback (A) doesn\'t address drift; threshold adjustment (C) is a workaround, not a fix.'},
  {id:20,domain:'B',type:'MC',
   q:'Which of the following MOST accurately describes the purpose of adversarial training in hardening AI security models?',
   opts:['A. Training the model on synthetic data generated by a GAN to improve generalization','B. Incorporating adversarially crafted examples into training so the model learns to correctly classify them, improving robustness against evasion attacks','C. Using a second AI model to verify the primary model\'s outputs before they are returned to users','D. Training the model across multiple decentralized data sources to prevent single-point data poisoning'],
   ans:1,
   exp:'Adversarial training exposes the model to adversarial examples during training, causing it to learn more robust decision boundaries that are harder to exploit with crafted inputs at inference time.'},
  {id:21,domain:'B',type:'MC',
   q:'An organization uses a third-party AI vendor for employee monitoring. The vendor\'s model is updated monthly. Which of the following controls BEST manages the risk of a vendor-introduced model update causing harm?',
   opts:['A. Requiring the vendor to provide model performance benchmarks with each update','B. Implementing a staging environment where vendor updates are tested against internal evaluation datasets before production promotion','C. Encrypting communication between the vendor\'s model and the organization\'s HRIS system','D. Reviewing the vendor\'s SOC 2 Type II report annually'],
   ans:1,
   exp:'Pre-production testing of vendor model updates in a staging environment with internal evaluation data catches regressions, bias changes, and unexpected behaviors before they affect employees — active technical control vs. passive compliance review.'},
  {id:22,domain:'B',type:'PB',
   scenario:'Forensic analysis of a compromised AI pipeline reveals that an attacker gained access to the model training server and injected 1,200 training samples into the dataset. The injected samples all contained a specific invisible pixel pattern in benign-looking images, and the resulting model now classifies any image with that pixel pattern as \'safe\', regardless of content.',
   q:'Which of the following BEST describes this attack, and which control would have MOST effectively detected it?',
   opts:['A. Adversarial evasion; detected by output confidence monitoring','B. Backdoor/trojan attack via data poisoning; detected by dataset provenance validation, anomaly detection on new samples, and model behavior testing with trigger patterns','C. Model inversion; detected by restricting API query volume','D. Prompt injection; detected by input sanitization at the inference layer'],
   ans:1,
   exp:'A backdoor attack embeds a hidden trigger during training that activates misclassification on demand. Detection requires: (1) provenance tracking to flag injected samples, (2) anomaly detection on dataset additions, and (3) post-training trigger testing with known patterns.'},
  {id:23,domain:'B',type:'MC',
   q:'A company implements federated learning so that AI models are trained across distributed hospital locations without raw patient data leaving each site. Which of the following residual risks must still be managed even with this architecture?',
   opts:['A. The central model aggregation server may still be vulnerable to model update poisoning from a compromised participant','B. Federated learning transmits raw training data in encrypted form, creating data residency risk','C. The distributed architecture prevents the use of differential privacy techniques','D. Federated learning models cannot be updated after initial training without centralizing data'],
   ans:0,
   exp:'Federated learning protects raw data but a compromised participant can submit poisoned model gradient updates that corrupt the global model during aggregation — a recognized attack requiring Byzantine-robust aggregation defenses.'},
  {id:24,domain:'B',type:'MC',
   q:'Which of the following MLOps practices MOST directly reduces the risk of a degraded AI model remaining in production undetected?',
   opts:['A. Using containerization to ensure consistent model runtime environments','B. Implementing continuous performance monitoring with automated drift detection and alerting thresholds','C. Maintaining comprehensive model cards documenting training data and intended use','D. Requiring code review for all changes to model inference scripts'],
   ans:1,
   exp:'Continuous performance monitoring with drift detection automatically identifies when model outputs diverge from expected behavior, triggering alerts before degradation causes operational or security harm.'},
  {id:25,domain:'B',type:'PB',
   scenario:'A security team is asked to evaluate whether their organization\'s AI-based access control system, which uses facial recognition for physical security, complies with applicable security standards. The system makes autonomous access decisions with no human review step. The team discovers the model has a 15% higher false rejection rate for employees with darker skin tones.',
   q:'Which of the following actions should the security team recommend FIRST?',
   opts:['A. Encrypt facial recognition data at rest and in transit to meet data protection requirements','B. Suspend automated access decisions pending a bias audit and implementation of human-in-the-loop review for rejected cases, and retrain with balanced demographic data','C. Reduce the facial recognition confidence threshold to lower the false rejection rate for all users equally','D. Implement a secondary authentication factor for all employees to compensate for model errors'],
   ans:1,
   exp:'A 15% disparate error rate by race is a critical fairness failure. Immediate suspension of autonomous decisions with human review addresses harm; bias audit identifies root cause; retraining with balanced data fixes it. Adjusting threshold (C) doesn\'t address demographic disparity.'},
  {id:26,domain:'C',type:'MC',
   q:'A SOC team wants to reduce mean time to detect (MTTD) for lateral movement events that individually appear benign but form an attack chain over hours. Which of the following AI capabilities BEST addresses this?',
   opts:['A. Real-time signature matching against known lateral movement hashes','B. AI-driven event correlation that sequences and scores low-confidence events into high-confidence attack chains over time','C. Deploying a SOAR playbook that blocks any account executing more than 5 commands per minute','D. Using an LLM to summarize daily security events for analyst review'],
   ans:1,
   exp:'Lateral movement involves distributed, low-and-slow activity that no single alert captures. AI correlation engines sequence temporally distributed events (login, enumeration, credential use, data access) into a unified attack narrative — reducing MTTD without individual event thresholds.'},
  {id:27,domain:'C',type:'MC',
   q:'An organization integrates AI into its vulnerability management program. The AI system prioritizes CVEs based on CVSS score only. A security architect recommends enhancing the model. Which additional data source would MOST improve prediction of exploitability in the wild?',
   opts:['A. The number of lines of code changed in the vendor patch','B. Real-time threat intelligence including exploit-db availability, dark web chatter, and observed exploitation telemetry','C. The affected product\'s market share to estimate attacker interest','D. The time since the CVE was published in the NVD database'],
   ans:1,
   exp:'CVSS base score is static and does not reflect actual exploitation activity. Dynamic threat intelligence (exploit availability, dark web discussion, active scanning) strongly predicts near-term exploitability and is the key enhancement for AI-driven vulnerability prioritization.'},
  {id:28,domain:'C',type:'PB',
   scenario:'A SOAR platform is configured to automatically block source IPs flagged by the AI threat detection system. During a critical business period, the AI system flags the organization\'s cloud provider\'s IP range as malicious due to anomalous traffic from a new cloud service just deployed. Blocking the IPs causes a 4-hour service outage.',
   q:'Which of the following changes to the SOAR configuration BEST prevents recurrence while maintaining security automation benefits?',
   opts:['A. Disable AI-driven automated blocking entirely and require all blocks to be manually approved','B. Implement contextual whitelisting for known infrastructure, tiered response (alert→analyst review→auto-block) for high-impact actions, and human-in-the-loop approval for blocks affecting critical infrastructure IP ranges','C. Increase the confidence threshold for automated blocking from 80% to 95% to reduce false positive blocks','D. Deploy a secondary AI model to validate the primary model\'s blocking recommendations before execution'],
   ans:1,
   exp:'Tiered response preserves automation for clear cases while adding human review for high-impact or infrastructure-affecting actions. Whitelisting known infrastructure prevents false positives from new deployments. Threshold increase alone (C) doesn\'t protect against infrastructure misclassification.'},
  {id:29,domain:'C',type:'MC',

  {id:30,domain:'C',type:'MC',

  {id:31,domain:'C',type:'PB',
   scenario:'A security operations team receives the following evidence from their AI-powered SIEM:\n• 03:12 AM — user account "svc_backup" authenticates from IP 185.220.x.x (Tor exit node)\n• 03:14 AM — svc_backup runs 47 LDAP queries enumerating all AD groups\n• 03:18 AM — svc_backup accesses the HR file share and downloads 12GB of data\n• 03:22 AM — svc_backup initiates outbound connection to pastebin.com',

   ans:1,

  {id:32,domain:'C',type:'MC',

  {id:45,domain:'D',type:'PB',

  {id:47,domain:'D',type:'MC',

  {id:48,domain:'D',type:'PB',

  {id:49,domain:'A',type:'MC',

  {id:55,domain:'A',type:'MC',

let answered = {};
let activeDomain = 'ALL';
let correct = 0;
let total = 0;

function updateStats() {
  const a = Object.keys(answered).length;
  const c = Object.values(answered).filter(v=>v.correct).length;
  document.getElementById('s-answered').textContent = a;
  document.getElementById('s-correct').textContent = c;
  document.getElementById('s-pct').textContent = a > 0 ? Math.round(c/a*100)+'%' : '—';
  document.getElementById('s-remain').textContent = 60 - a;
}

function renderTabs() {
  const container = document.getElementById('domainTabs');
  const all = `<button class="dtab ${activeDomain==='ALL'?'on':''}" onclick="setDomain('ALL')">All questions (60)</button>`;
  const tabs = DOMAINS.map(d => {
    const count = QUESTIONS.filter(q=>q.domain===d.id).length;
    return `<button class="dtab ${activeDomain===d.id?'on':''}" onclick="setDomain('${d.id}')">${d.label} (${count})</button>`;
  }).join('');
  container.innerHTML = all + tabs;
}

function renderQuestions() {
  const qs = activeDomain === 'ALL' ? QUESTIONS : QUESTIONS.filter(q=>q.domain===activeDomain);
  const d = activeDomain !== 'ALL' ? DOMAINS.find(x=>x.id===activeDomain) : null;
  let html = '';
  if(d) {
    html += `<div class="domain-badge"><span class="dbadge">${d.pct} of exam</span><span class="domain-title">${d.label}</span></div>`;
  }
  qs.forEach((q,i) => {
    const key = q.id;
    const ans = answered[key];
    html += `<div class="qcard">
      <span class="qtype ${q.type==='MC'?'qtype-mc':'qtype-pb'}">${q.type==='MC'?'Multiple choice':'Performance-based'}</span>
      <div class="qnum">Question ${q.id} of 60 · Domain ${q.domain}</div>`;
    if(q.scenario) html += `<div class="scenario-box"><i class="ti ti-file-description" style="font-size:14px;vertical-align:-2px;margin-right:5px" aria-hidden="true"></i>${q.scenario}</div>`;
    html += `<div class="qtext">${q.q}</div><div class="opts">`;
    q.opts.forEach((opt,oi) => {
      let cls = 'opt';
      if(ans !== undefined) {
        cls += ' disabled';
        if(oi === q.ans) cls += ' show-correct';
        if(oi === ans.choice && ans.choice !== q.ans) cls += ' wrong';
        if(oi === ans.choice && ans.choice === q.ans) cls += ' correct';
      }
      html += `<button class="${cls}" onclick="choose(${q.id},${oi})">${opt}</button>`;
    });
    html += `</div><div class="exp ${ans!==undefined?'show':''}" id="exp-${q.id}"><strong>${ans!==undefined?(ans.correct?'Correct. ':'Incorrect. '):''}</strong>${q.exp}</div></div>`;
  });
  document.getElementById('domainContent').innerHTML = html;
}

function choose(qid, oi) {
  if(answered[qid] !== undefined) return;
  const q = QUESTIONS.find(x=>x.id===qid);
  answered[qid] = {choice: oi, correct: oi===q.ans};
  updateStats();
  renderQuestions();
}

function setDomain(d) {
  activeDomain = d;
  renderTabs();
  renderQuestions();
}

function submitExam() {
  const a = Object.keys(answered).length;
  const c = Object.values(answered).filter(v=>v.correct).length;
  const pct = Math.round(c/60*100);
  const pass = pct >= 75;
  let domainBreakdown = '';
  DOMAINS.forEach(d => {
    const dQs = QUESTIONS.filter(q=>q.domain===d.id);
    const dAnswered = dQs.filter(q=>answered[q.id]!==undefined);
    const dCorrect = dQs.filter(q=>answered[q.id]?.correct);
    const dpct = dAnswered.length > 0 ? Math.round(dCorrect.length/dQs.length*100) : '—';
    domainBreakdown += `<div class="dr-card"><div class="dr-score">${dpct}${typeof dpct==='number'?'%':''}</div><div class="dr-label">${dCorrect.length}/${dQs.length} correct</div><div class="dr-domain">${d.label}</div></div>`;
  });
  document.getElementById('resultsContent').innerHTML = `
    <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px">
      <span class="score-pct">${pct}%</span>
      <span class="score-sub">${c} of 60 correct · ${60-a} unanswered</span>
    </div>
    <div class="pass-badge ${pass?'pass':'fail'}">${pass?'Pass — above 75% threshold':'Not yet — below 75% threshold'}</div>
    <div class="domain-results">${domainBreakdown}</div>
    <div style="margin-top:1rem;font-size:12px;color:var(--color-text-secondary)">Review incorrect answers above by browsing domain tabs. Focus extra study on domains scoring below 75%.</div>
  `;
  document.getElementById('resultsPanel').classList.add('show');
  document.getElementById('submitBtn').textContent = 'Results shown below';
}

renderTabs();
renderQuestions();
</script>
